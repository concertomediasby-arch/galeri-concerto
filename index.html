<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>Galeri</title>
<style>
  :root { --bg:#0e0f12; --panel:#17191e; --line:#2a2d35; --text:#e9eaee; --muted:#8c909a; --accent:#d4a24c; }
  * { box-sizing:border-box; }
  html, body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  body.locked { overflow:hidden; }
  header { padding:18px 16px 6px; max-width:980px; margin:0 auto; }
  h1 { margin:0; font-size:19px; font-weight:650; }
  main { max-width:980px; margin:0 auto; padding:6px 0 50px; }
  h2 { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.8px;
       margin:22px 16px 10px; display:flex; justify-content:space-between; }
  h2 span { text-transform:none; letter-spacing:0; font-weight:500; }
  canvas { display:block; pointer-events:none; }

  /* ---------- Slider ---------- */
  .slider-wrap { position:relative; }
  .slider { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth;
    scrollbar-width:none; gap:10px; padding:0 16px; scroll-padding:0 16px; }
  .slider::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; scroll-snap-align:center; position:relative; aspect-ratio:4/3;
    background:#000; border-radius:12px; overflow:hidden; cursor:zoom-in; }
  .slide canvas { width:100%; height:100%; object-fit:contain; }
  .slide .cap { position:absolute; left:0; right:0; bottom:0; padding:22px 14px 10px; font-size:14px;
    background:linear-gradient(transparent, rgba(0,0,0,.7)); }
  .slide .hint { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); border-radius:999px;
    padding:5px 10px; font-size:11px; color:#ddd; }
  .shield { position:absolute; inset:0; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:40px; height:40px;
    border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:20px; cursor:pointer; }
  .arrow.l { left:24px; } .arrow.r { right:24px; }
  @media (hover:none) { .arrow { display:none; } }
  .thumbs { display:flex; gap:8px; overflow-x:auto; padding:12px 16px 2px; scrollbar-width:none; }
  .thumbs::-webkit-scrollbar { display:none; }
  .thumb { flex:none; width:64px; height:48px; border-radius:7px; overflow:hidden; opacity:.45;
    border:2px solid transparent; cursor:pointer; background:#000; position:relative; }
  .thumb.active { opacity:1; border-color:var(--accent); }
  .thumb canvas { width:100%; height:100%; object-fit:cover; }

  /* ---------- Dokumen ---------- */
  .docs { display:grid; gap:10px; padding:0 16px; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
  .doc { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
  .doc .cover { aspect-ratio:3/4; background:#fff; position:relative; overflow:hidden; }
  .doc .cover canvas { width:100%; height:100%; object-fit:cover; object-position:top; }
  .doc .meta { padding:9px 11px 11px; }
  .doc .name { font-size:14px; font-weight:600; }
  .doc .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .status { color:var(--muted); text-align:center; padding:40px 10px; font-size:14px; }

  /* ---------- Jendela (overlay) ---------- */
  .modal { position:fixed; inset:0; z-index:50; background:#060608; display:none; flex-direction:column;
    animation:fade .18s ease; }
  .modal.open { display:flex; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .mbar { display:flex; align-items:center; gap:10px; padding:12px 12px 10px 16px; border-bottom:1px solid #1e2026; }
  .mtitle { flex:1; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mcount { font-size:13px; color:var(--muted); }
  .close { width:38px; height:38px; border-radius:50%; border:0; background:#22252c; color:#fff; font-size:20px; cursor:pointer; }
  .mbody { flex:1; position:relative; min-height:0; }
  .lb { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .lb::-webkit-scrollbar { display:none; }
  .lb .item { flex:0 0 100%; height:100%; scroll-snap-align:center; display:flex; align-items:center;
    justify-content:center; padding:12px; position:relative; }
  .lb canvas { max-width:100%; max-height:100%; width:auto; height:auto; }
  .pages { height:100%; overflow-y:auto; padding:14px 12px 40px; }
  .pages canvas { width:100%; max-width:900px; margin:0 auto 6px; background:#fff; border-radius:4px; }
  .pages .pn { text-align:center; color:var(--muted); font-size:12px; margin:0 0 16px; }

  footer { color:var(--muted); font-size:11px; text-align:center; padding:0 16px 30px; }
  body.away main, body.away .modal { filter:blur(28px); }
  @media print { body * { display:none !important; } body::after { content:"Konten ini tidak dapat dicetak."; display:block; padding:40px; } }
  .sub { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .back { display:inline-flex; align-items:center; gap:4px; margin:0 0 10px; padding:6px 12px 6px 8px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13px; cursor:pointer; }
  .cars { display:grid; gap:12px; padding:0 16px; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); }
  .car { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; }
  .car .cover { aspect-ratio:16/10; background:#000; position:relative; overflow:hidden; }
  .car .cover canvas { width:100%; height:100%; object-fit:cover; }
  .car .meta { padding:12px 14px 14px; display:flex; justify-content:space-between; align-items:center; }
  .car .name { font-size:15px; font-weight:600; }
  .car .go { color:var(--accent); font-size:13px; }
  .empty { max-width:420px; margin:70px auto; padding:0 24px; text-align:center; color:var(--muted); font-size:15px; line-height:1.6; }
  .empty .ic { font-size:40px; margin-bottom:10px; color:var(--accent); }
</style>
</head>
<body>
<header id="head"><h1 id="judul"></h1><p class="sub" id="subjudul"></p></header>
<main id="main"><div class="status">Memuat…</div></main>
<footer>Konten hanya untuk dilihat. Dilarang menyebarkan tanpa izin.</footer>

<div class="modal" id="modal">
  <div class="mbar">
    <div class="mtitle" id="mtitle"></div>
    <div class="mcount" id="mcount"></div>
    <button class="close" id="mclose" aria-label="Tutup">✕</button>
  </div>
  <div class="mbody" id="mbody"></div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="app.js"></script>
</body>
</html>
